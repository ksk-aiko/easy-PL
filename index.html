<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんたん損益計算書</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --text: #1f2933; --muted: #6b7785;
    --line: #e2e8f0; --plus: #1a7f4b; --minus: #c92a2a; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1b222b; --text: #e6ebf0; --muted: #94a0ad;
      --line: #2c3642; --plus: #4cc38a; --minus: #ff7b7b; --accent: #6ea0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: .95rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .row label { flex: 1; }
  .input-wrap { display: flex; align-items: center; gap: 6px; }
  input[type=text] {
    width: 160px; padding: 8px 10px; font-size: 1rem; text-align: right;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .unit { color: var(--muted); font-size: .85rem; width: 1.2em; }
  .result .row { border-bottom: 1px solid var(--line); }
  .result .row:last-child { border-bottom: 0; }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .big { font-size: 1.15rem; padding-top: 12px; }
  .big .val { font-size: 1.6rem; }
  .pos { color: var(--plus); } .neg { color: var(--minus); }
  .ratio { color: var(--muted); font-size: .85rem; text-align: right; }
  button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: .85rem;
  }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>かんたん損益計算書</h1>
  <p class="sub">金額を入れるだけで営業利益を計算します(単位:円)。</p>

  <section class="card">
    <h2>売上・原価</h2>
    <div class="row"><label for="sales">売上高</label>
      <div class="input-wrap"><input type="text" id="sales" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
    <div class="row"><label for="cogs">売上原価</label>
      <div class="input-wrap"><input type="text" id="cogs" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
  </section>

  <section class="card">
    <h2>販売費及び一般管理費</h2>
    <div class="row"><label for="labor">人件費</label>
      <div class="input-wrap"><input type="text" id="labor" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
    <div class="row"><label for="rent">家賃</label>
      <div class="input-wrap"><input type="text" id="rent" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
    <div class="row"><label for="ads">広告宣伝費</label>
      <div class="input-wrap"><input type="text" id="ads" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
    <div class="row"><label for="other">その他経費</label>
      <div class="input-wrap"><input type="text" id="other" inputmode="numeric" placeholder="0"><span class="unit">円</span></div></div>
  </section>

  <section class="card result" aria-live="polite">
    <h2>計算結果</h2>
    <div class="row"><span>売上総利益(粗利)</span><span class="val" id="gross">0</span></div>
    <div class="row"><span class="ratio">売上総利益率</span><span class="ratio" id="grossRate">-</span></div>
    <div class="row"><span>販管費合計</span><span class="val" id="sga">0</span></div>
    <div class="row big"><span>営業利益</span><span class="val" id="op">0</span></div>
    <div class="row"><span class="ratio">営業利益率</span><span class="ratio" id="opRate">-</span></div>
  </section>

  <div class="foot">
    <span>入力内容はこのブラウザ内にのみ保存されます</span>
    <button type="button" id="reset">クリア</button>
  </div>
</main>

<script>
(() => {
  const ids = ["sales", "cogs", "labor", "rent", "ads", "other"];
  const el = Object.fromEntries(
    [...ids, "gross", "grossRate", "sga", "op", "opRate", "reset"].map(i => [i, document.getElementById(i)])
  );
  const KEY = "easy-pl:v1";
  const yen = n => (n < 0 ? "-" : "") + "¥" + Math.abs(n).toLocaleString("ja-JP");
  const pct = (a, b) => (b ? (a / b * 100).toFixed(1) + "%" : "-");
  // 全角数字・カンマ・円記号を許容して数値化
  const parse = s => {
    const t = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
               .replace(/[,，¥円\s]/g, "");
    const n = Number(t);
    return Number.isFinite(n) ? n : 0;
  };
  const tone = (node, n) => { node.classList.toggle("pos", n > 0); node.classList.toggle("neg", n < 0); };

  function calc() {
    const v = Object.fromEntries(ids.map(i => [i, parse(el[i].value)]));
    const gross = v.sales - v.cogs;
    const sga = v.labor + v.rent + v.ads + v.other;
    const op = gross - sga;
    el.gross.textContent = yen(gross);
    el.grossRate.textContent = pct(gross, v.sales);
    el.sga.textContent = yen(sga);
    el.op.textContent = yen(op);
    el.opRate.textContent = pct(op, v.sales);
    tone(el.gross, gross); tone(el.op, op);
    try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(ids.map(i => [i, el[i].value])))); } catch {}
  }

  // 入力欄はフォーカスを外したときに3桁区切りに整形
  ids.forEach(i => {
    el[i].addEventListener("input", calc);
    el[i].addEventListener("blur", () => {
      if (el[i].value.trim() !== "") el[i].value = parse(el[i].value).toLocaleString("ja-JP");
      calc();
    });
    el[i].addEventListener("focus", () => { el[i].value = el[i].value.replace(/,/g, ""); });
  });

  el.reset.addEventListener("click", () => { ids.forEach(i => (el[i].value = "")); calc(); });

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    ids.forEach(i => { if (saved[i]) el[i].value = saved[i]; });
  } catch {}
  calc();
})();
</script>
</body>
</html>
